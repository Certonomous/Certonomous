# Submarine sail: NACA 0015 section, chord 1.2 m, span 1.8 m, flat tip.
# Generated by sdk/scripts/make_naca0015.py (closed-TE thickness polynomial,
# watertight, surfaceCheck-clean).
#
# There is no experimental drag reference for this finite-span sail, so no
# `cd`/`tolerance` fields are provided: the study grades on convergence and
# mesh quality only and can never claim VALIDATED against a made-up number.
#
# Solve hints put the case in the requested regime: Re = 6e6 on the 1.2 m
# chord with the pipeline's air kinematic viscosity nu = 1.5e-5 m^2/s,
# so V = Re * nu / c = 6e6 * 1.5e-5 / 1.2 = 75.0 m/s.
# The chord runs along +X, so the streamwise axis is stated rather than
# left to the heuristic (the 1.8 m span would otherwise win).
name: naca0015_sail
section: NACA 0015
chord_m: 1.2
span_m: 1.8
solve:
  velocity: 75.0
  streamwise_axis: 0
source: "geometry generated in-house; regime from the design request (Re 6e6, chord 1.2 m)"
