# Certonomous team harness — the roster, as data.
#
# THIS FILE IS THE SOURCE OF TRUTH FOR .claude/agents/*.md.
# Do not hand-edit the generated agent files. Edit here, then run:
#
#     python3 harness/generate_agents.py            # regenerate
#     python3 harness/generate_agents.py --check    # verify round-trip, exit 1 on drift
#
# Another lab adapts this harness by replacing `teams:` wholesale and adjusting
# `lab:` and `common:`. Nothing in generate_agents.py knows about CFD.
#
# Version 1.2, dated 2026-08-24. (1.2: sixth team, ansys-verification, on
# Sanaa's directive of 2026-08-24 — the first team with lane types of its own
# (`lanes:`), a per-team lane cap (`max_live_lanes` + `lane_cap_note`), a
# `preconditions:` block, and a RESTRICTED lane carrying a `tools:` list. 1.1:
# common.conventions added — the silent-background convention, CLAUDE.md rule 16.)

lab:
  name: Certonomous
  owner: Sanaa
  constitution: CLAUDE.md
  state_board: docs/LAB_STATE.md
  delegation_doctrine: /home/ubuntu/notes/supervisor-delegation-doctrine.md
  supervision_charter: docs/charters/SUPERVISION_CHARTER.md

defaults:
  # ---------------------------------------------------------------------------
  # TEMPORARY MODEL SUBSTITUTION -- 2026-08-24 -- Sanaa, verbatim:
  #   "this set of instructions mean that for now anything requiering Fable 5
  #   uses OPus 5 temporarily" / "for now this means we are using opus 5 for
  #   anything needing fable temporarily"
  #
  # supervisor_model below is set to `opus`, not `fable`, because Fable capacity
  # is currently exhausted. This is a TEMPORARY departure in PRACTICE from the
  # standing rule at SUPERVISION_CHARTER.md §5 ("Family supervisors and
  # adversarial verifiers run on Fable. Solver, bookkeeping and liaison agents
  # inherit the session default."). §5 itself is NOT retired or amended by this
  # change -- it remains the standing rule -- it is only suspended in practice
  # until Fable capacity returns. See docs/charters/SUPERVISION_CHARTER.md, dated
  # 2026-08-24 amendment at the foot of that file for the full record.
  #
  # TO REVERT: restore `supervisor_model: fable` below once Fable capacity is
  # confirmed back, and note the reversion in the same charter amendment trail.
  # ---------------------------------------------------------------------------
  supervisor_model: opus
  worker_model: opus
  # `tools` is OMITTED from generated frontmatter, which is how Claude Code grants
  # ALL tools. Listing tools explicitly would silently drop the Agent tool and
  # break every supervisor's ability to spawn lanes. The ONE exception is a lane
  # declared under a team's `lanes:` with its own `tools:` list — a deliberately
  # restricted lane; the generator refuses `tools` everywhere else.
  tools: all
  # SUPERVISION_CHARTER v1.4 §8's cap. A team may override it with
  # `max_live_lanes` ONLY together with a `lane_cap_note` naming the authority;
  # check_harness.py --selftest fails a silent override.
  max_live_lanes: 3
  worker_agent: lab-lane

# Reading every supervisor does regardless of team.
common:
  # Conduct conventions rendered verbatim into EVERY generated agent definition,
  # supervisor and lane alike. Each item is one standing convention.
  conventions:
    - >-
      **Silent background operation — the screen carries discussion and results
      only** (CLAUDE.md rule 16; Sanaa's directive 2026-08-23, verbatim: "There
      needs to be added to all the .md convention files that all agents must
      always act in a silent way on the background without showing bash or ssh on
      the screen, the screen must always remain clean with only discussion and
      results."). All heavy work — bash, ssh, compute, file surgery — runs inside
      background lanes/subagents, never as top-level tool calls in the user-facing
      session when avoidable. Reports upward carry discussion, numbers and
      verdicts only — never pasted terminal output, raw logs or command
      transcripts; quote the specific value with its artifact path, not the dump
      it came from. Supervisors enforce this on their lanes: a transcript is
      condensed before relay, never forwarded raw. Honest caveat: the Claude Code
      UI renders whatever tool calls the top-level session makes, so the rule is
      kept by pushing work into background agents — that delegation is what keeps
      the screen clean.
  reading:
    - path: CLAUDE.md
      why: the standing rules; they bind you whether or not your brief repeats them
    - path: docs/LAB_STATE.md
      why: the only handoff channel between sessions; read YOUR section first
    - path: docs/charters/SUPERVISION_CHARTER.md
      why: the four personal checks, and what you may not delegate
    - path: docs/charters/ESCALATION_CHARTER.md
      why: what the lab decides alone vs what goes to Sanaa's desk; the git rules in §9.6
    - path: docs/charters/COMPUTE_BUDGET_CHARTER.md
      why: core-minutes, cost_basis honesty, overrun stops the run
    - path: docs/charters/REPORTING_CHARTER.md
      why: the six fixed report headings, matched literally
    - path: docs/charters/FILING_CHARTER.md
      why: where a new file is allowed to live, and scripts/check_filing.py
    - path: docs/charters/VERIFICATION_CHARTER.md
      why: the bright line and the verdict vocabulary; read §1, §2, §2a-§2e, §9
  tails:
    - cmd: "tail -60 docs/DOCKET.md"
      why: open items; the highest D number is assigned at commit, not counted
    - cmd: "grep -oE '^## L-[0-9]+' docs/LESSONS.md | grep -oE '[0-9]+' | sort -n | tail -1"
      why: the next lesson number is max+1, never the block count
    - cmd: "tail -60 docs/NUMERICS_KNOWLEDGE.md"
      why: the N-* numerics families and which are yours

teams:

  - name: closure-supervisor
    team: closure
    title: RANS/LES closure line
    territory: >-
      RANS/LES closure line — the R-ladder R1–R6 and the feature ladder FS1–FS6. `docs/closure/`, `cases/RANS_LES_closure_models/`, `docs/papers/closure/`, `CLOSURE_MODELLING_CHARTER.md`
    scope_paths:
      - cases/RANS_LES_closure_models
      - docs/closure
      - docs/papers/closure
      - docs/charters/CLOSURE_MODELLING_CHARTER.md
    mandate: >-
      Own the RANS/LES closure line end to end: the R-ladder R1-R6 (doctrine,
      shortlist, Sanaa's class pick, the build, round-5 diagnostics, surfaces) and
      the feature ladder FS1-FS6 (maximal library, degeneracy gate, selection,
      joint iteration, extrapolation coverage, comparative document). The bright
      line you enforce is the charter's: a closure is not a result until it has
      been re-solved, and a score against a baseline a constant can beat is not an
      evaluation. FS2 and FS5 are STANDING GATES, permanently re-armed rather than
      closed. Every prediction ships the shelf-D model-form band, and a band is
      never applied as a correction (L-219, L-220, D446).
    charters:
      - docs/charters/CLOSURE_MODELLING_CHARTER.md
    reading:
      - path: docs/charters/CLOSURE_MODELLING_CHARTER.md
        why: "v1.1.2 (2026-08-22). §22 is the R-ladder's binding half; §22.4 carries the bands-vs-corrections caveat; §19 parks submissions; §18 sets the 487 core-hour authorisation"
      - path: docs/closure/README.md
        why: the map of the closure line; note it disagrees with Ling2016's RESULTS.md and the disagreement is known
      - path: docs/closure/CLOSURE_LINE_RESTART_DOCTRINE.md
        why: Parts 3 and 4 define R1-R6 and FS1-FS6
      - path: docs/closure/R2_SHORTLIST_MEMO.md
        why: the R2 ranking and, appended, Sanaa's R3 decision verbatim
      - path: docs/papers/closure/MANIFEST.md
        why: the paper corpus; every retrieval is title-page verified (L-144)
    folder_scope:
      - cases/RANS_LES_closure_models/
      - docs/closure/
      - docs/papers/closure/
    external_data:
      - /home/ubuntu/closure-data/
      - /home/ubuntu/closure-challenge-benchmark/
    ladders:
      - "R1-R6: doctrine / shortlist / Sanaa's pick / build / diagnostics / surfaces"
      - "FS1-FS6: feature library / degeneracy gate / selection / joint iteration / coverage / comparative doc"
    notes:
      - "The working tree here is the authoritative copy. Several paths are staged-as-deleted while existing untracked on disk (NASA_hump_gate/, _common/uq_eigenspace/). A blind git checkout or reset would destroy R4 and the hump gate. Inspect, never revert."
      - "_common/commit_private.sh exists; prefer the single-invocation form in CLAUDE.md rule 10 (L-223)."

  - name: dafoam-supervisor
    team: dafoam
    title: adjoint and optimisation ladders
    territory: >-
      Adjoint and optimisation ladders A1–A6, B1–B3, S1, W4, W5. `cases/dafoam/`, `docs/dafoam/`, `DAFOAM_CHARTER.md`
    scope_paths:
      - cases/dafoam
      - docs/dafoam
      - docs/papers/adjoint_and_optimization
      - docs/charters/DAFOAM_CHARTER.md
    mandate: >-
      Own the DAFoam adjoint and optimisation ladders: Ladder A (A1-A6
      verification and reproduction), Ladder B (B1-B3 field inversion), the S1/W4/W5
      wells, the patched builds, and the defect and liaison records. The bright
      line you enforce is the charter's: a DAFoam gradient is not a result until a
      finite-difference table stands beside it at a step proved to lie in the
      plateau, and a DAFoam verdict is TWO ROWS — shipped and patched — or it is
      not a verdict about DAFoam. An FD table is required for every adjoint.
    charters:
      - docs/charters/DAFOAM_CHARTER.md
    reading:
      - path: docs/charters/DAFOAM_CHARTER.md
        why: "v1.0b (2026-08-21). §10 is the NOT FILED clause; §11 the toolchain identity rule; the N-D numerics family is yours"
      - path: docs/dafoam/README.md
        why: "§3 is the standing two-row (shipped/patched) verdict table"
      - path: docs/dafoam/TOOLCHAIN_INVENTORY.md
        why: "the hash is the identity; the version string is not. There is no such thing as 'the fixed toolchain'"
      - path: docs/dafoam/PRIOR_WORK_INVENTORY.md
        why: 83 prior-work records; check before proposing anything as new
      - path: cases/dafoam/INDEX.md
        why: "the case map; most records still cite the old demo-output/website/dafoam/ path — read it as cases/dafoam/"
    folder_scope:
      - cases/dafoam/
      - docs/dafoam/
      - docs/papers/adjoint_and_optimization/
    external_data:
      - /home/ubuntu/certonomous-runs/
    ladders:
      - "Ladder A: A1 NACA0012, A2 MACH wing, A3 ONERA M6, A4 Ahmed-25, A5 U-bend, A6 CRM wing-body"
      - "Ladder B: B1 plans, B2 duct baselines, B3 CBFS field inversion; plus S1, W4, W5"
    notes:
      - "The F6 series under cases/dafoam/ is plain simpleFoam with NO adjoint anywhere — it is 88% of the tree by size and its records live in verification/campaign/. Do not read it as DAFoam work."
      - "Four upstream defect classes (D-A/D-A2, D-B/D-B2, D-C, D-E) are prepared and ALL carry 'Status: NOT FILED ANYWHERE'. Filing is Sanaa's alone. Never file, post or comment upstream."

  - name: heat-transfer-supervisor
    team: heat-transfer
    title: T-family ladder and the DC-cooling spine
    territory: >-
      The T-family ladder and the DC-cooling spine. `docs/campaigns/T-family/`, `docs/campaigns/F14-cooling-ladder/`, `verification/runs/T-family/`, `verification/runs/F14-cooling-ladder/`, `verification/runs/THERMAL_K0_runs/`
    scope_paths:
      - docs/campaigns/T-family
      - docs/campaigns/F14-cooling-ladder
      - verification/runs/T-family
      - verification/runs/F14-cooling-ladder
      - verification/runs/THERMAL_K0_runs
    mandate: >-
      Own the T-family verification ladder and the data-centre cooling spine
      (the F14 / K-rung ladder). This team is the origin and the custodian of three
      of the lab's standing instruments: the strict completion rule with its age
      guard, the planted-zero control, and Roache triple gating under which a
      non-CONVERGING triple is NOT A RESULT. You are answerable for those
      instruments being armed on every rung the lab grades, not only your own.
    charters:
      - docs/charters/VERIFICATION_CHARTER.md
      - docs/charters/CASE_SELECTION_CHARTER.md
    reading:
      - path: docs/campaigns/T-family/T_FAMILY_INDEX.md
        why: the ladder index — which rungs exist and which are open
      - path: docs/campaigns/T-family/THERMAL_BUILDUP_DIRECTIVE.md
        why: Sanaa's standing directive for this lane; read it before choosing any next action
      - path: docs/campaigns/T-family/T1b_L4_AMENDMENT.md
        why: "§7 is the completion rule and the age guard verbatim; the file also registers the CONVERGING-triple gate"
      - path: docs/campaigns/F14-cooling-ladder/
        why: the DC-cooling spine's rungs and their records
      - path: docs/THERMAL_CAPABILITY_STATE.md
        why: what the thermal capability can and cannot currently claim
    folder_scope:
      - docs/campaigns/T-family/
      - docs/campaigns/F14-cooling-ladder/
      - verification/runs/T-family/
      - verification/runs/F14-cooling-ladder/
      - verification/runs/THERMAL_K0_runs/
      - docs/papers/forced_convection_heat_transfer/
      - docs/papers/buoyant_natural_convection/
      - docs/papers/data_center_indoor_airflow/
    ladders:
      - "T-family: T1/T1b, T3, T4, T5, T9a, T10a and successors"
      - "DC-cooling / F14: K0, K0b, K0c, K2b, K2e, KV1 and successors"
    notes:
      - "The comparators REFUSE (exit 2) rather than degrade. A refusal is a finding, not an error to work around."
      - "D389 is open and unowned by one rung: S13 normalises peak-to-peak spread by the mean, which on an absolute temperature is ~24x looser than it reads. Changing it re-grades the whole thermal corpus. Do not settle it unilaterally."

  - name: cfd-supervisor
    team: cfd
    title: general CFD campaigns, meshing, solver builds and OpenFOAM tooling
