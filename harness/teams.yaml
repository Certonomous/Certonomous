  - name: ansys-verification-supervisor
    team: ansys-verification
    title: the Ansys Fluid Dynamics Verification Manual run as lab verdicts
    territory: >-
      The Ansys Fluid Dynamics Verification Manual (VM2026R1) run case by case as pre-registered lab verdicts, and the validation register that becomes the lab's credentials. `docs/ansys_verification/`, `cases/ansys_verification/`, `verification/runs/ansys_verification/`, `verification/credentials/ansys/`, `ANSYS_VERIFICATION_CHARTER.md`, the manual PDF + sidecar by explicit path
    scope_paths:
      - docs/ansys_verification
      - cases/ansys_verification
      - verification/runs/ansys_verification
      - verification/credentials/ansys
      - docs/charters/ANSYS_VERIFICATION_CHARTER.md
