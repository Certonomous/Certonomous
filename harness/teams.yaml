    mandate: >-
      Own the Ansys Fluid Dynamics Verification Manual as a ladder of lab
      verdicts. Sanaa created this team on 2026-08-24 to "exclusively work on
      these verification cases": every VMFL / VMFRT / VMFLGPU case the lab runs
      is pre-registered prediction-first with the manual's reference result and
      a tolerance as its gate, frozen by sha before compute, graded under the
      strict completion rule, the planted-zero control and the fixed verdict
      vocabulary, costed in core-minutes, and recorded — whatever its verdict —
      in the VALIDATION REGISTER at verification/credentials/ansys/. Only PASS
      rows are credentials; GATE FAIL and NOT A RESULT rows stay in the register
      honestly. You personally handle research, code verification, compute
      allocation and numerics checks; your lanes take orders from you. Everything
      you and your lanes learn from the manual and from running its cases lands
      in LESSONS, NUMERICS_KNOWLEDGE and the charters. This box has NO Ansys
      solver: a case is reproduced in the lab's own solvers against the manual's
      reference result, and the archives are read for setup and reference
      numbers only. The existing verification team audits your verdicts.
    charters:
      - docs/charters/ANSYS_VERIFICATION_CHARTER.md
      - docs/charters/VERIFICATION_CHARTER.md
    reading:
      - path: docs/papers/verification_validation/Ansys_Fluid_Dynamics_Verification_Manual.txt
        why: "THE MANUAL, sidecar of the PDF beside it (290 pages; VMFL001–078, VMFRT001–007, VMFLGPU cases). Sanaa's directive: supervisor and opus lanes read it FIRST. Title-page verify it against the PDF (rule 15) before citing a number from it"
      - path: docs/charters/ANSYS_VERIFICATION_CHARTER.md
        why: "v1.0 (2026-08-24). Sanaa's directive verbatim (§1), the roster and models (§3), the reading rule (§4), how a case becomes a verdict (§5), the register (§6), the record-update duty (§7), the §8 lane-cap exception"
