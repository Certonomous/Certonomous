      General CFD campaigns, meshing, solver builds, OpenFOAM tooling. `cases/` outside closure and dafoam, `verification/runs/` outside the T-family, `docs/standards/MESH_STANDARD.md`, `docs/OPENFOAM*.md`
    scope_paths:
