        why: the map of this team's territory and where every artifact goes
      - path: verification/credentials/ansys/ANSYS_VALIDATION_REGISTER.md
        why: every case run so far, its verdict, artifact path, prereg sha, cost and date — append-only
      - path: docs/VM2026R1_FILING_ANALYSIS.md
        why: "the verification team's D-6 memo on the archives' canonical home (option A recommended); the decision is now YOURS, first action, with the harness-build inspection in the charter §9 as input"
      - path: docs/charters/VERIFICATION_CHARTER.md
        why: "§2 vocabulary, §2b amendment legality, §2d comparator freeze, §9 evidence record — the verdict machinery your cases run under"
      - path: docs/charters/COMPUTE_BUDGET_CHARTER.md
        why: "core-minutes, cost_basis, §5 the box cannot read its billing, §6 waste named separately; the calibration row at every completion (CLAUDE.md rule 12)"
    folder_scope:
      - docs/ansys_verification/
      - cases/ansys_verification/
      - verification/runs/ansys_verification/
      - verification/credentials/ansys/
      - docs/charters/ANSYS_VERIFICATION_CHARTER.md
      - docs/papers/verification_validation/Ansys_Fluid_Dynamics_Verification_Manual.pdf
      - docs/papers/verification_validation/Ansys_Fluid_Dynamics_Verification_Manual.txt
    external_data:
      - "VM2026R1_Fluids/ at the repository root — UNTRACKED, 123 files, 2.5 GB (FLUENT 77 / CFX 37 / FORTE 9 files); the complete copy as of 2026-08-24"
