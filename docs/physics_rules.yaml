# Certonomous physics rules — knowledge-driven admissibility thresholds.
#
# The lab reads its method-admissibility limits from here rather than hardcoding
# them in a workflow, so a ruling on camera can point to a stated criterion.
# Every threshold carries the reasoning it rests on.

womersley:
  # The Womersley number alpha = R * sqrt(omega/nu) compares transient inertia
  # to viscous diffusion over a cycle. It decides whether a pulsatile internal
  # flow can be treated as a sequence of steady problems.
  #
  # Two criteria, deliberately separated:
  #
  #  - strict_quasi_steady_max: below alpha ~ 1 the velocity profile follows the
  #    instantaneous pressure gradient with negligible phase lag, so each instant
  #    IS a steady problem. This is the textbook quasi-steady limit.
  #
  #  - multipoint_screening_max: a multi-POINT decomposition is a weaker, explicit
  #    screening approximation — solve steady problems at a few phase points and
  #    cycle-weight them. It captures the dominant flow-rate dependence of a
  #    quantity like orifice pressure loss even when alpha is well above 1,
  #    PROVIDED the phase-interaction (history / added-mass) terms it drops are
  #    carried as a named model-form limitation and the result is capped at
  #    TREND ONLY. It is a ranking-and-screening tool, not a validated cycle solve.
  #    The ceiling of ~25 reflects that above it the transient jet structure
  #    reorganises within a cycle and a steady-per-phase picture stops being even
  #    a useful screen. The physiological aortic root sits near alpha ~ 17.
  strict_quasi_steady_max: 1.0
  multipoint_screening_max: 25.0

mesh_quality:
  # Mesh admissibility gates, codified 2026-07-25 by the reading program (R1).
  # Full basis and failure modes: docs/standards/MESH_STANDARD.md.
  #
  # Citations:
  #  - checkMesh acceptance thresholds compiled into OpenFOAM v2606:
  #    nonOrthThreshold 70 deg, skewThreshold 4, aspectThreshold 1000
  #    (src/OpenFOAM/meshes/primitiveMesh/primitiveMeshCheck/primitiveMeshCheck.C).
  #  - snappyHexMesh generation defaults: maxNonOrtho 65, maxInternalSkewness 4,
  #    maxBoundarySkewness 20, minVolRatio 0.01 (etc/caseDicts/meshQualityDict).
  #  - Calibration: NASA TMR flat-plate reference grids on disk measure max
  #    aspect ratio 66643 to 74041 with non-orthogonality 0 and machine-precision
  #    skewness (demo-output/website/tmr/runs/*/log.checkMesh). A hard aspect
  #    ratio gate would reject every reference-grade boundary-layer grid.
  #
  # The two hard gates match what the geometry workflow already enforces
  # (70 and 4); writing them here makes the values governed rather than moving
  # them. The advisory entries are new and await enforcement wiring, proposed
  # in the agenda inbox as r1-mesh-gate-extension.
  max_non_orthogonality_deg: 70.0     # hard gate; checkMesh acceptance threshold
  non_orthogonality_warn_deg: 65.0    # warning band start; snappy generation constraint
  max_skewness: 4.0                   # hard gate, boundary faces included; checkMesh failure threshold
  aspect_ratio_advisory: 1000.0       # advisory only; above it an alignment justification is required
  aspect_ratio_flag_with_non_ortho_deg: 60.0  # aspect ratio above advisory AND non-ortho above this is a flag
  aspect_ratio_flag_with_skewness: 2.0        # aspect ratio above advisory AND skew above this is a flag
  min_volume_ratio_warn: 0.01         # adjacent-cell volume ratio warning; snappy generation floor

sobol:
  # Admissibility gates for variance-based (Sobol) sensitivity, codified
  # 2026-07-31 as Stage 3 of the Innovation Standard for the method whose
  # Stage-2 offline evidence is recorded in
  # docs/standards/INNOVATION_STANDARD.md. The primitive is
  # sdk/chief_engineer/sensitivity.py; the mission that reads these numbers is
  # sdk/workflows/sobol_sensitivity.py.
  #
  # Basis:
  #  - Dakota Reference Manual, sampling with variance based decomposition,
  #    and Dakota Theory Manual (Sandia National Laboratories): the
  #    pick-and-freeze design and its n_base * (M + 2) cost.
  #  - Saltelli et al. 2010 (first-order estimator), Jansen 1999
  #    (total-effect estimator).
  #
  # The identities are exact in expectation: every index lies in [0, 1], each
  # first-order index is at or below its own total-effect index, and the
  # first-order indices sum to at most 1 (with equality only for a purely
  # additive model). A finite sample violates them by estimator noise, so the
  # gates below separate noise from a genuine violation.
  #
  #  - identity_slack: how far a POINT estimate may break an identity before
  #    the run is treated as noise-dominated and the base sample is raised.
  #    Set at 0.05 of the whole variance, which is the scale of the
  #    run-to-run movement measured on the two lab models between base
  #    samples of 800 and 12800 (mains summing to 1.014, 1.003, 0.991 on the
  #    valve screen and 0.999, 1.015 on the airliner chain). A violation
  #    wider than this is not sampling scatter.
  #  - min_base_samples: the opening design, N of 200, as the approved
  #    proposal r1-sobol-sensitivity-mission priced it.
  #  - max_base_samples: the ceiling a mission may escalate to before it
  #    reports the ranking unresolved rather than spending further. At 3200
  #    base samples a two-input case costs 12800 evaluations, still under a
  #    second on a reduced-order path.
  #  - Two inputs whose bootstrap intervals overlap are UNRESOLVED at that
  #    budget and are never force-ranked; the base sample doubles until they
  #    separate or the ceiling is reached.
  identity_slack: 0.05
  min_base_samples: 200
  max_base_samples: 3200
  bootstrap_resamples: 200
  confidence_level: 0.95

thermal:
  # Buoyant-flow admissibility gates, codified 2026-08-17 at rung K1a of the F14
  # cooling ladder out of what rungs K0a, K0b and K0c measured. Until K1a every
  # one of these lived inside a single rung's own analysis script and died with
  # it; the whole point of this block is that the next thermal solve inherits
  # them instead of re-deriving them. The primitives that read these numbers are
  # scripts/heat_balance.py and scripts/check_convergence.py.
  #
  # ===========================================================================
  # 1. CONVERGENCE, ON THE GRADED QUANTITY -- NOT ON THE RESIDUALS
  # ===========================================================================
  # The criterion is a PEAK-TO-PEAK SPREAD of the graded thermal quantity
  # (Nusselt number, wall heat flux, whatever the rung grades) over a FIXED
  # window of outer iterations, read out of the running solver's own in-pass
  # function-object output. It is not a residual test, it is not an endpoint
  # test, and it is not a fraction of the run. Each of those three was tried and
  # each failed on a measured case:
  #
  #  - NOT THE RESIDUALS. K0c's four fine meshes all met their own
  #    `residualControl` and were still two to three orders of magnitude off
  #    the criterion below: 2.19, 3.98 and 4.67 percent of drift in Nu_avg
  #    against 0.02 percent, and 14.65 percent on the g = 0 twin. An
  #    under-relaxed SIMPLE outer loop moves the smooth modes at a rate that
  #    falls off like 1/N^2, so doubling the mesh needs roughly four times the
  #    iterations while the residuals go quiet on schedule. Graded on "the
  #    residuals stopped moving", K0c's Ra = 1e3 pair would have reported a
  #    FINE mesh FURTHER from the benchmark than its own COARSE mesh -- 1.0940
  #    against 1.1191 -- and the rung would have failed on iteration error
  #    while calling it a mesh result.
  #  - NOT THE ENDPOINT DIFFERENCE. K0c's Ra1e6_m192 approaches steady state as
  #    a decaying oscillation whose period is about 400 outer iterations, the
  #    same length as the window. An endpoint test can be read at a phase where
  #    the two ends happen to agree while the quantity is still swinging by ten
  #    times the band between them. The peak-to-peak spread over the same window
  #    cannot be aliased that way and is never smaller than the endpoint
  #    difference, so it is the conservative reading of the same samples.
  #  - NOT A FRACTION OF THE RUN. A last-quarter window silently loosens as a
  #    run is extended: the same case passes by being run longer. A fixed
  #    iteration count means the same thing whatever the run length.
  #
  # 0.02 percent is one fiftieth of the tightest pass band K0c gated on (1.0
  # percent), so iteration error is a fiftieth of the smallest thing the gate is
  # asked to resolve. The window of 400 iterations at a sample interval of 50
  # gives 9 samples; fewer than that is REFUSED rather than scored, because a
  # spread over three points is not a spread.
  monitor_peak_to_peak_max_pct: 0.02
  monitor_window_iterations: 400
  monitor_sample_interval_iterations: 50
  monitor_min_samples: 9
  #
  # THE NULL-VARIATION REFUSAL (added 2026-08-18 at rung K2b).
  # A SPREAD THAT IS NOT RESOLVED CANNOT PASS, AND THE REASON IS THE ONE K0b
  # FOUND IN THE HEAT BALANCE, ARRIVING HERE.
  #
  # This criterion asks "has the graded quantity stopped moving?" It cannot
  # answer that on a quantity that never STARTED, and until K2b it did not
  # refuse -- it returned its BEST POSSIBLE SCORE. Measured on K2b's fine mesh:
  # the graded rack-inlet temperature printed 289.0000002 falling to 289 across
  # the whole 400-iteration window, a spread of 1e-07 K in the last place of a
  # ten-significant-figure print, and scored 0.00000 percent against a 0.02
  # percent band. The same case's heat balance was 2.6632 percent out and its
  # free boundary was swinging 0.23585 percent. The quantity was PINNED at the
  # supply temperature because the cold aisle had not been reached yet.
  #
  # That is the identity defect this file already records for the sealed-case
  # heat balance, wearing the convergence criterion's clothes: A QUANTITY THAT
  # CANNOT MOVE SCORES PERFECTLY ON A TEST OF WHETHER IT HAS STOPPED MOVING.
  # Two of K2b's own controls read perfectly on that same case for the same
  # reason -- the offset readback erred by 0.000e+00 and the mass-versus-area
  # averaging comparison by -0.0001 percent -- because the rack face was still
  # uniform. A monitor or a control is most flattering exactly where the case
  # is least converged.
  #
  # THE RULE. The spread is compared against the resolution the series is
  # PRINTED at, measured from the samples themselves (the most precise sample
  # fixes the precision; OpenFOAM strips trailing zeros, so one sample reading
  # `289` and the next `289.0000002` are the same ten-figure series). Below
  # this many units in the last place the spread is not resolved by the log,
  # so it cannot distinguish "stopped" from "never started" from "pinned by a
  # boundary condition", and the criterion REFUSES rather than scoring -- the
  # same refusal `heat_balance.py` makes on an undefined imbalance ratio
  # instead of printing a flattering number for it.
  #
  # THE CONSTANT IS NOT LOAD-BEARING, AND THAT IS MEASURED RATHER THAN ASSERTED.
  # Re-graded over all 14 cases graded under the old reading -- K0c's eleven and
  # K2b's three -- the verdict set is IDENTICAL for every floor from 2 to
  # 13,161 ulp, a span of 3.8 orders of magnitude. It breaks at 1 (too low to
  # catch the defect at all) and at 13,200 (which begins refusing K0c's
  # genuinely converged Ra1e3_m32, whose spread is 13,161 ulp). 10 sits inside
  # that plateau, three orders clear of the nearest true positive.
  #
  # RE-GRADE OF THE 14 AFFECTED CASES: exactly ONE verdict changed. K2b's fine
  # mesh moves CONVERGED -> CANNOT_TELL. K0c's eleven are untouched, four
  # CONVERGED and seven NOT_CONVERGED as before, the closest of them 1,316x
  # clear of this floor.
  monitor_min_resolved_ulp: 10
  #
  # ===========================================================================
  # 2. BOUSSINESQ VALIDITY -- A WARNING, AND IT IS NOT ACADEMIC
  # ===========================================================================
  # The Boussinesq approximation carries density variation in the buoyancy term
  # only and treats it as constant everywhere else. That needs beta.dT << 1.
  # This is a WARNING and not a hard gate: a violation does not mean the
  # arithmetic is wrong, it means the momentum equation being solved is no
  # longer the momentum equation the problem has, and the run must either
  # justify that explicitly or move to a compressible thermo solver.
  #
  # THE NUMBERS, RE-DERIVED AT K1a FROM THE CASE DICTIONARIES THEMSELVES:
  #  - K0a ran at beta = 3.333333e-03 1/K (constant/transportProperties) with a
  #    wall-to-wall dT of 10 K (0.orig/T: 310 K against 300 K), so
  #    beta.dT = 3.333333e-02. Satisfied, by a factor of 3.
  #  - For an ideal gas beta = 1/TRef, so at TRef = 300 K the approximation
  #    reaches beta.dT = 0.1 at dT = 0.1 * 300 = 30.0 K exactly, and at the
  #    case's own rounded beta at dT = 30.000003 K.
  #  - THIS IS INSIDE THE RANGE THE LADDER IS AIMED AT. A 40 K rise puts
  #    beta.dT at 0.1333. The ladder's later rungs are not a laboratory cavity
  #    at 1 K; any of them run at a realistic rise crosses this line, and the
  #    crossing is the reason the threshold is recorded here rather than left in
  #    one rung's prose.
  boussinesq_beta_dT_max: 0.1
  boussinesq_dT_max_K_at_TRef_300: 30.0
  #
  # ===========================================================================
  # 3. TURBULENT PRANDTL NUMBER -- RECORDED ON EVERY SOLVE
  # ===========================================================================
  # Prt sets the turbulent thermal diffusivity, alphat = nut/Prt, and therefore
  # every wall heat flux a turbulent thermal solve reports. It is a MODELLING
  # CHOICE with no measured value on this lab's cases, it is rarely stated in a
  # write-up, and a reader cannot reconstruct it from anything else in the
  # report. So it is recorded per solve, with its provenance -- read from the
  # case's own constant/transportProperties, or this default when the case is
  # silent -- and never silently assumed. On a laminar solve alphat is
  # identically zero and Prt does not enter the answer; it is still recorded,
  # because "it did not matter here" is a fact about this case and not about the
  # next one.
  turbulent_prandtl_default: 0.85
  #
  # ===========================================================================
  # 4. HEAT-BALANCE CLOSURE -- AND WHY A PASS IS NOT EVIDENCE
  # ===========================================================================
  # THE THRESHOLD CARRIES ITS OWN REFUTATION, BECAUSE A THRESHOLD THAT DOES NOT
  # INVITES EXACTLY THE FALSE CONFIDENCE W-2 FORBIDS.
  #
  # On a SEALED, IMPERMEABLE, STEADY case the boundary heat balance is very
  # nearly an IDENTITY. The discrete temperature equation is solved to a tight
  # linear tolerance at every outer iteration; div(phi,T) integrates to zero
  # over the domain because phi is conservative and no wall passes mass; so the
  # boundary conduction terms are forced to sum to zero AT EVERY ITERATION,
  # CONVERGED OR NOT. K0b pre-registered "imbalance above 20 percent on an
  # early, unconverged snapshot" and measured 0.0128 percent at iteration 10,
  # never above 0.13 percent at any iteration. The prediction was not a near
  # miss; it was the wrong kind of quantity.
  #
  # SO: a closure number at or below this threshold, on a sealed case, is NOT
  # evidence that the physics is right. A quantity derivable by construction is
  # an identity and cannot gate anything. It is reported because the
  # specification requires it and because it is cheap, and it is never counted
  # as evidence for a rung.
  #
  # WHAT THE CHECK IS STILL WORTH, STATED NARROWLY. It catches wrong fluid
  # properties, wrong patch areas, a wrong sign convention, a patch omitted from
  # the sum, ANY unaccounted energy source or sink, and -- the case where it is
  # genuinely not an identity -- any domain with through-flow, where the
  # advective enthalpy flux is an independent contribution.
  heat_balance_tol_pct: 0.5
  heat_balance_closure_is_evidence_on_sealed_case: false
  #
  # ===========================================================================
  # 4b. THE OPEN CASE, WHICH IS A DIFFERENT ANSWER (rung KV1, 2026-08-17)
  # ===========================================================================
  # The line above says `..._on_sealed_case` and until KV1 the open case had no
  # statement of its own, because scripts/heat_balance.py did not compute the
  # advective enthalpy flux at all -- while printing, on exactly those cases,
  # that the balance was "a genuine constraint here". The term is now computed
  # and validated (docs/campaigns/F14-cooling-ladder/KV1_RESULTS.md), so the
  # open case gets its own answer and it is NOT the sealed one.
  #
  # ON AN OPEN CASE WITH THROUGH-FLOW THE CLOSURE IS A MEASUREMENT. The
  # advective term depends on the SOLUTION -- on the outlet temperature and on
  # the solver's own face flux phi -- and the discretisation does not force it,
  # so unlike the sealed closure it moves with convergence. MEASURED at KV1 on
  # the KV1c heated duct, the same case at eleven iteration counts against the
  # T equation's own initial residual:
  #
  #     iter   T initial residual   imbalance      exit
  #       20        8.011e-03        20.881167 %     1
  #       40        3.166e-03         9.856046 %     1
  #       60        1.002e-03         3.184486 %     1
  #       80        1.886e-04         0.593174 %     1
  #      100        2.459e-05         0.069250 %     0
  #      120        5.150e-07         0.000889 %     0
  #      140        8.819e-09         0.000009 %     0
  #      201        4.346e-12         0.000000 %     0
  #
  # Nine decades, and the gate actually discriminates: the exit code flips
  # between iteration 80 and 100 where the percentage crosses this block's own
  # 0.5 percent band. Set that beside K0b's SEALED case, which read 0.0128
  # percent at iteration 10 and never rose above 0.13 percent at ANY iteration.
  # The sealed number never approaches its gate; the open one crosses it.
  #
  # WHAT IT CATCHES, STATED NARROWLY: an unconverged energy field, a mis-set
  # temperature offset, a flow-rate mismatch between a face pair, a patch
  # omitted from the ledger. Measured at KV1 by mutation, on the same committed
  # field set: sign of the advective term flipped -> 45.66 percent, scaled by
  # two -> 17.44 percent, one open patch dropped -> 100 percent.
  #
  # AND WHAT IT DOES NOT CATCH, WHICH MUST TRAVEL WITH IT EVERY TIME IT IS
  # QUOTED. CIRCULATION. Carried from K2a section 8 unchanged, not re-derived:
  # a solve with the aisle flow structure entirely wrong -- supply
  # short-circuiting to the return, reversed aisle recirculation -- still closes
  # perfectly once converged, because closure tests conservation and not WHERE
  # the energy travelled. Closure on an open case is NECESSARY, NEVER
  # SUFFICIENT, and no K2b sentence may cite it as validation evidence.
  #
  # KV1 itself establishes nothing about circulation either: a duct with one
  # inlet and one outlet has no aisle flow to get wrong.
  heat_balance_closure_is_convergence_sensitive_on_open_case: true
  heat_balance_closure_establishes_circulation: false
  #
  # THE DATUM, AND WHY IT IS GOVERNED RATHER THAN LEFT TO A CALLER. The
  # advective enthalpy flux is referred to a temperature datum. The NET is
  # datum-free when mass balances, but the DENOMINATOR of the imbalance ratio is
  # not: the datum decides how much of the through-flow's ABSOLUTE enthalpy is
  # counted as "heat entering". Measured at KV1 on KV1c, the denominator is
  # 8.979442 W at a 0 K datum against 0.2079685 W at the case's TRef -- a factor
  # of 43.2, so the same 0.5 percent band would carry 4.49e-02 W of slack
  # instead of 1.04e-03 W. Using absolute T is a 43-fold LOOSENING of this gate
  # at an unchanged number.
  #
  # It is also the one advective error the closure test CANNOT catch: the datum
  # cancels from the net when mass balances, so a case with the wrong datum
  # still passes. Hence the datum is fixed to the case's own TRef in
  # scripts/heat_balance.py, recorded per report as `advective.datum_K` and
  # `advective.datum_source`, and never taken from a command line.
  heat_balance_advective_datum: TRef
  #
  # MASS IS GATED, BECAUSE THE ENTHALPY LEDGER RESTS ON IT. Shifting the datum
  # by dT moves the ledger by rho.cp.dT.(net volumetric flux), so an enthalpy
  # balance over a boundary that does not conserve mass depends on an arbitrary
  # number. An open case whose boundary mass imbalance exceeds
  # `heat_balance_tol_pct` is reported with `advective.ledger_complete: false`
  # and CANNOT PASS. No new threshold: the same governed tolerance is used.
  heat_balance_open_case_gates_mass_imbalance: true
  #
  # THE PART THAT IS A MEASUREMENT, AND THE CONTRAST IS THE WHOLE POINT. Unlike
  # the sealed-case closure, the RECOVERY OF A PLANTED SOURCE is
  # convergence-sensitive and therefore says something. Measured at K1c on one
  # case (K0c's C3 cavity, plant +5.000000000e-03 W) at eight iteration counts,
  # against the T equation's own initial residual at the same iteration:
  #
  #     iter   T initial residual   recovery error
  #      100        4.511e-03         -24.139   %
  #      200        5.546e-04          -4.2034 %
  #      300        8.456e-05          -0.66860 %
  #      400        1.321e-05          -0.10497 %
  #      500        2.101e-06          -1.6706e-02 %
  #     1000        2.218e-10          -1.7593e-06 %
  #     2000        2.574e-12          +3.6348e-09 %
  #     4000        3.486e-12          +2.3876e-09 %
  #
  # The error tracks the residual across SEVEN decades. Set that beside K0b's
  # sealed no-source case, which read 0.0128 percent at iteration 10 and never
  # rose above 0.13 percent at any iteration: one of these two quantities is
  # measuring the solution and the other is measuring the discretisation. That
  # is why the planted-source control earns its keep and the bare closure number
  # does not.
  heat_balance_source_recovery_tol_pct: 0.1
  #
  # WHEN THE RATIO HAS NO DENOMINATOR. imbalance% = 100.|sum Q| / sum(Q > 0)
  # divides by the heat actually entering. On a case whose every patch carries
  # heat OUT -- exactly what a planted volumetric source produces -- that
  # denominator is zero and the ratio is undefined. It must be REPORTED as
  # undefined, with the watts stated, and the case must FAIL. It must NOT be
  # rescued by renormalising onto the outflow: with no inward patch,
  # sum(Q<0) IS the net, so |net| / |sum(Q<0)| = 1 exactly, and the "percentage"
  # would read 100.0000 percent for every such case whatever the source size.
  # That is another identity, and swapping an honest refusal for one is a
  # straight loss. Measured at K1c: the mirror case (a planted SINK, every patch
  # carrying heat IN) already prints exactly 100.0000 percent today, for that
  # reason. See scripts/heat_balance.py, "WHEN THE IMBALANCE RATIO IS UNDEFINED".
  heat_balance_undefined_ratio_fails: true
