# Certonomous physics rules — knowledge-driven admissibility thresholds.
#
# The lab reads its method-admissibility limits from here rather than hardcoding
# them in a workflow, so a ruling on camera can point to a stated criterion.
# Every threshold carries the reasoning it rests on.

womersley:
  # The Womersley number alpha = R * sqrt(omega/nu) compares transient inertia
  # to viscous diffusion over a cycle. It decides whether a pulsatile internal
  # flow can be treated as a sequence of steady problems.
  #
  # Two criteria, deliberately separated:
  #
  #  - strict_quasi_steady_max: below alpha ~ 1 the velocity profile follows the
  #    instantaneous pressure gradient with negligible phase lag, so each instant
  #    IS a steady problem. This is the textbook quasi-steady limit.
  #
  #  - multipoint_screening_max: a multi-POINT decomposition is a weaker, explicit
  #    screening approximation — solve steady problems at a few phase points and
  #    cycle-weight them. It captures the dominant flow-rate dependence of a
  #    quantity like orifice pressure loss even when alpha is well above 1,
  #    PROVIDED the phase-interaction (history / added-mass) terms it drops are
  #    carried as a named model-form limitation and the result is capped at
  #    TREND ONLY. It is a ranking-and-screening tool, not a validated cycle solve.
  #    The ceiling of ~25 reflects that above it the transient jet structure
  #    reorganises within a cycle and a steady-per-phase picture stops being even
  #    a useful screen. The physiological aortic root sits near alpha ~ 17.
  strict_quasi_steady_max: 1.0
  multipoint_screening_max: 25.0

mesh_quality:
  # Mesh admissibility gates, codified 2026-07-25 by the reading program (R1).
  # Full basis and failure modes: docs/standards/MESH_STANDARD.md.
  #
  # Citations:
  #  - checkMesh acceptance thresholds compiled into OpenFOAM v2606:
  #    nonOrthThreshold 70 deg, skewThreshold 4, aspectThreshold 1000
  #    (src/OpenFOAM/meshes/primitiveMesh/primitiveMeshCheck/primitiveMeshCheck.C).
  #  - snappyHexMesh generation defaults: maxNonOrtho 65, maxInternalSkewness 4,
  #    maxBoundarySkewness 20, minVolRatio 0.01 (etc/caseDicts/meshQualityDict).
  #  - Calibration: NASA TMR flat-plate reference grids on disk measure max
  #    aspect ratio 66643 to 74041 with non-orthogonality 0 and machine-precision
  #    skewness (demo-output/website/tmr/runs/*/log.checkMesh). A hard aspect
  #    ratio gate would reject every reference-grade boundary-layer grid.
  #
  # The two hard gates match what the geometry workflow already enforces
  # (70 and 4); writing them here makes the values governed rather than moving
  # them. The advisory entries are new and await enforcement wiring, proposed
  # in the agenda inbox as r1-mesh-gate-extension.
  max_non_orthogonality_deg: 70.0     # hard gate; checkMesh acceptance threshold
  non_orthogonality_warn_deg: 65.0    # warning band start; snappy generation constraint
  max_skewness: 4.0                   # hard gate, boundary faces included; checkMesh failure threshold
  aspect_ratio_advisory: 1000.0       # advisory only; above it an alignment justification is required
  aspect_ratio_flag_with_non_ortho_deg: 60.0  # aspect ratio above advisory AND non-ortho above this is a flag
  aspect_ratio_flag_with_skewness: 2.0        # aspect ratio above advisory AND skew above this is a flag
  min_volume_ratio_warn: 0.01         # adjacent-cell volume ratio warning; snappy generation floor

sobol:
  # Admissibility gates for variance-based (Sobol) sensitivity, codified
  # 2026-07-31 as Stage 3 of the Innovation Standard for the method whose
  # Stage-2 offline evidence is recorded in
  # docs/standards/INNOVATION_STANDARD.md. The primitive is
  # sdk/chief_engineer/sensitivity.py; the mission that reads these numbers is
  # sdk/workflows/sobol_sensitivity.py.
  #
  # Basis:
  #  - Dakota Reference Manual, sampling with variance based decomposition,
  #    and Dakota Theory Manual (Sandia National Laboratories): the
  #    pick-and-freeze design and its n_base * (M + 2) cost.
  #  - Saltelli et al. 2010 (first-order estimator), Jansen 1999
  #    (total-effect estimator).
  #
  # The identities are exact in expectation: every index lies in [0, 1], each
  # first-order index is at or below its own total-effect index, and the
  # first-order indices sum to at most 1 (with equality only for a purely
  # additive model). A finite sample violates them by estimator noise, so the
  # gates below separate noise from a genuine violation.
  #
  #  - identity_slack: how far a POINT estimate may break an identity before
  #    the run is treated as noise-dominated and the base sample is raised.
  #    Set at 0.05 of the whole variance, which is the scale of the
  #    run-to-run movement measured on the two lab models between base
  #    samples of 800 and 12800 (mains summing to 1.014, 1.003, 0.991 on the
  #    valve screen and 0.999, 1.015 on the airliner chain). A violation
  #    wider than this is not sampling scatter.
  #  - min_base_samples: the opening design, N of 200, as the approved
  #    proposal r1-sobol-sensitivity-mission priced it.
  #  - max_base_samples: the ceiling a mission may escalate to before it
  #    reports the ranking unresolved rather than spending further. At 3200
  #    base samples a two-input case costs 12800 evaluations, still under a
  #    second on a reduced-order path.
  #  - Two inputs whose bootstrap intervals overlap are UNRESOLVED at that
  #    budget and are never force-ranked; the base sample doubles until they
  #    separate or the ceiling is reached.
  identity_slack: 0.05
  min_base_samples: 200
  max_base_samples: 3200
  bootstrap_resamples: 200
  confidence_level: 0.95
